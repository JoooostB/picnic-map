services:
  redis:
    image: redis:8-alpine
    # Durable persistence: AOF (every write) + periodic RDB snapshots.
    command: redis-server --appendonly yes --save 60 1000
    volumes:
      - redis-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      # Generous timeout: IO stalls on the host must not fail a healthy Redis.
      timeout: 5s
      retries: 5

  app:
    build: .
    depends_on:
      redis:
        condition: service_healthy
    environment:
      - REDIS_URL=redis://redis:6379
      - PORT=3000
      # Picnic postcode source token (read from host .env via compose)
      - POSTCODE_TECH_API_TOKEN=${POSTCODE_TECH_API_TOKEN}
      # Probing knobs
      - PROBE_ENABLED=true
      # Be gentle: Picnic's CloudFront WAF blocks bursts. One worker, ~1s apart.
      - PROBE_CONCURRENCY=1
      - PROBE_DELAY_MS=1100
      - POSTCODE_TECH_DAILY_LIMIT=9500
      # PC6 refinement: after the PC4 sweep, probe every full postcode inside
      # covered/waitlist areas for street-level accuracy (~460k probes/cycle).
      - PC6_REFINE_ENABLED=true
      # A full PC6 pass takes days at 1 probe/sec, so it recycles slower (30d).
      #- PC6_CACHE_TTL_MS=2592000000
    ports:
      - "3000:3000"
    # Cache the downloaded PC4 GeoJSON on the host so rebuilds don't re-fetch.
    volumes:
      - ./data:/app/data
    restart: unless-stopped

volumes:
  redis-data:
